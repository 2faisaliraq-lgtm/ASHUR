name: ashur
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: "none" # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.9+10

environment:
  sdk: ^3.9.2

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  material_ui: ^1.11.0
  cupertino_ui: ^1.1.6

  cached_network_image: ^4.0.7
  cloud_firestore: ^7.1.0
  cloud_functions: ^7.1.0
  collection: ^1.18.0
  connectivity_plus: ^7.3.2
  cupertino_icons: ^2.0.0
  currency_text_input_formatter: ^2.2.3
  dartz: ^0.10.1
  device_info_plus: ^13.3.0
  equatable: ^3.0.0
  # file_picker: ^8.0.0
  firebase_auth: ^7.1.0
  firebase_core: ^5.2.0
  firebase_messaging: ^17.1.0
  firebase_storage: ^14.1.0
  fl_chart: ^1.1.1
  flutter_bloc: ^9.1.1
  flutter_screenutil: ^5.9.3
  flutter_staggered_grid_view: ^0.7.0
  form_validator: ^2.1.1
  get_it: ^9.2.0
  google_sign_in: ^7.2.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  http: ^1.2.2
  image_picker: ^1.1.2
  intl: ^0.20.2
  lottie: ^3.1.2
  mobile_scanner: ^7.5.0
  # open_file: ^3.5.7 - Removed due to plugin registrant errors
  package_info_plus: ^10.2.2
  path_provider: ^2.1.4
  pdf: ^3.11.1
  permission_handler: ^13.0.2
  persian_datetime_picker: ^3.2.0
  # printing: ^5.13.0 - Removed due to AGP 9+ compatibility issues
  pull_to_refresh: ^2.0.0
  qr_flutter: ^4.1.0
  responsive_framework: ^1.5.1
  share_plus: ^13.3.1
  shared_preferences: ^2.3.2
  shimmer: ^4.0.0
  url_launcher: ^6.3.1
  flutter_contacts: ^2.6.0
  firebase_app_check: ^0.5.2
  flutter_local_notifications: ^23.0.2
  onesignal_flutter: ^5.6.8
  timezone: ^0.11.1
  arabic_reshaper: ^0.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  build_runner: ^2.4.7
  flutter_launcher_icons: ^0.14.1
  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.1
  hive_generator: ^2.0.1
  json_annotation: ^4.9.0
  json_serializable: ^6.8.0
  mockito: ^5.4.4

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/images/
    - assets/icons/
    - assets/fonts/

  # Custom fonts - All available fonts
  fonts:
    - family: Amiri
      fonts:
        - asset: assets/fonts/Amiri-Regular.ttf
          weight: 400
        - asset: assets/fonts/Amiri-Italic.ttf
          weight: 400
          style: italic
        - asset: assets/fonts/Amiri-Bold.ttf
          weight: 700
        - asset: assets/fonts/Amiri-BoldItalic.ttf
          weight: 700
          style: italic
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
          weight: 400
        - asset: assets/fonts/Cairo-Light.ttf
          weight: 300
        - asset: assets/fonts/Cairo-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/Cairo-Medium.ttf
          weight: 500
        - asset: assets/fonts/Cairo-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700
        - asset: assets/fonts/Cairo-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Cairo-Black.ttf
          weight: 900
        - asset: assets/fonts/Cairo-VariableFont_slnt,wght.ttf
          weight: 400

# Flutter Launcher Icons Configuration
flutter_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/app_icon.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/images/app_icon.png"
    background_color: "#1B365D"
    theme_color: "#D4AF37"
  windows:
    generate: true
    image_path: "assets/images/app_icon.png"
    icon_size: 48
  # Android Adaptive Icon - خلفية زرقاء مع شعار في المقدمة
  adaptive_icon_background: "#1B365D"
  adaptive_icon_foreground: "assets/images/app_icon.png"
  # iOS - استخدام صورة واحدة
  remove_alpha_ios: true

# Flutter Native Splash - شاشة إقلاع طبيعية قبل تحميل Flutter
flutter_native_splash:
  color: "#1B365D"
  image: assets/images/lamassu2.png
  color_dark: "#1B365D"
  image_dark: assets/images/lamassu2.png
  android_12:
    image: assets/images/lamassu2.png
    icon_background_color: "#1B365D"
    image_dark: assets/images/lamassu2.png
    icon_background_color_dark: "#1B365D"
  web: false
  android_gravity: center
  ios_content_mode: center
  fullscreen: true
