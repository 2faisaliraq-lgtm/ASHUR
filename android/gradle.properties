org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -Dfile.encoding=UTF-8
android.useAndroidX=true
android.enableJetifier=true

# إعدادات Java - سيتم استخدام JAVA_HOME من متغيرات البيئة
kotlin.jvm.target.validation.mode=warning

# إعدادات Android
android.suppressUnsupportedCompileSdk=true

# إصلاح مشكلة Kotlin incremental caches مع Firebase dependencies
kapt.incremental.apt=false
kotlin.incremental=false
org.gradle.caching=false

# تجاوز إصدار Kotlin ليتوافق مع Firebase dependencies
kotlin.code.style=official
kotlin.version=2.4.20
android.builtInKotlin=true
android.newDsl=true
